<section class="hero"><div><div class="eyebrow">A FEW DAYS IN SINGAPORE</div><h1>新加坡<span>，慢一点。</span></h1><p>把夜色留给滨海湾，把一整天留给圣淘沙。<br>四天三晚，按区域走，也给临时起意留点位置。</p><div class="pills"><span class="pill active">9月30日 — 10月3日</span><span class="pill">4天 · 3晚 · 2人</span><span class="pill">参考计划 · 机酒未订</span></div></div><div class="hero-count"><b>04</b><span>DAYS AWAY</span></div></section>
<main><div class="left"><nav class="tabs" id="tabs" aria-label="行程分类" role="tablist"></nav><div id="content" role="tabpanel"></div></div><aside class="map-panel" aria-label="新加坡行程地图"><div class="map-title"><strong id="map-heading">新加坡 · 全程地点</strong><small>点地图标记查看地点</small></div><div id="map"></div><div id="map-notice" class="map-notice" role="status">地图暂时无法加载；行程仍可浏览，请使用每个地点的“导航”链接。</div><div class="map-footer"><div class="map-key"><span><i class="key-dot" style="background:#b96f2c"></i>D1 抵达</span><span><i class="key-dot" style="background:#176759"></i>D2 城市</span><span><i class="key-dot" style="background:#746c9e"></i>D3 圣淘沙</span><span><i class="key-dot" style="background:#438da0"></i>D4 返程</span></div><p>虚线表示游览顺序，不是步行或驾车路线；浅色圆圈为建议住宿片区，非已订酒店。地图需联网。</p></div></aside></main><div class="print-only" id="print-content"></div><noscript>请启用浏览器 JavaScript 查看每日时间线及交互地图。旅行日期：2026年9月30日至10月3日，机票与酒店尚未预订。</noscript>
<script>

function overview(){return '<div class="lead"><h2>两天完整游玩，首尾留白。</h2><p>以白天直飞为基准：9/30下午抵达，10/3下午返程。先住在Bugis或City Hall附近，再按最终机票和酒店微调接驳。</p></div><div class="stats"><div class="stat"><small>机票目标 · 双人往返</small><b>≤ '+money(QUOTE.budget)+'</b><span>首选'+esc(recommended.name)+' '+money(recommended.total)+' / 2人，含每程每人2件23 KG托运。携程含税报价，未锁价。</span></div><div class="stat"><small>住宿建议 · 连住3晚</small><b>Bugis / City Hall</b><span>酒店待定，地图仅标住宿片区</span></div></div><div class="section-label">YOUR FOUR DAYS / 四天怎么走</div>'+DAYS.map((d,i)=>'<button class="day-choice" style="--c:'+COLORS[i]+'" data-go="'+(i+1)+'"><span class="day-number">0'+(i+1)+'</span><div><h3>'+esc(d.title)+'</h3><p>'+esc(d.date)+' · '+['落地、晚餐、鱼尾狮散步','牛车水、新加坡河、花园灯光','环球影城主选，海滩看体力','带行李直达机场，Jewel与T4接驳'][i]+'</p></div><span class="arrow">↗</span></button>').join('')+'<div class="section-label">GOOD TO KNOW / 行程取舍</div><div class="note">这版不排动物园、夜间野生动物园和跨城行程；D4也不绕道Joo Chiat，避免行李与返程接驳挤占时间。D3不去环球影城，可换成甘榜格南与小印度。</div><div class="links"><button class="action" data-go="5">比较4组航班 →</button><button class="action" data-go="6">出发准备 →</button></div>'+footer();}
function stopCard(l,d,i){const type={transport:'交通',spot:'景点',food:'用餐',hotel:'住宿',drink:'休息'}[l.type]||'地点';let links=external(navUrl(l),'导航');if(local(l))links+='<button class="action" data-loc="'+d+':'+i+'">地图定位</button>';if(l.reserve)links+=external(l.reserve,'官网票务');if(l.source)links+=external(l.source,'官方 / 时刻参考');if(l.xhs)links+=external(l.xhs,'代表小红书笔记');else if(l.xhsKeyword)links+=external('https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(l.xhsKeyword),'小红书搜索');if(l.dianpingKeyword)links+=external('https://m.dianping.com/shoplist/2311/search?from=m_search&keyword='+encodeURIComponent(l.dianpingKeyword),'大众点评搜索');return '<article class="stop" style="--c:'+COLORS[d-1]+'"><div class="stop-top"><span class="time">'+esc(l.time==='—'?'有余力再选':l.time)+'</span><span class="type">'+type+'</span></div><h3>'+esc(l.name)+'</h3><p>'+esc(l.desc)+'</p>'+(l.budget?'<div class="budget">'+esc(l.budget.replace(/^预算：/,'规划预算：'))+'</div>':'')+'<div class="links">'+links+'</div>'+(l.detail?'<details><summary>交通与安排提示</summary><p>'+esc(l.detail)+'</p></details>':'')+'</article>';}
function dayView(id){const d=DAYS[id-1];return '<div class="day-head"><div class="eyebrow">DAY 0'+id+' · '+esc(d.date)+'</div><h2>'+esc(d.title)+'</h2><p>以下是建议时间；按最终航班、开放时间与天气调整。</p></div><div class="timeline">'+d.locations.map((l,i)=>l.time!=='—'?stopCard(l,id,i):'').join('')+'</div>'+(d.locations.some(l=>l.time==='—')?'<div class="section-label">OPTIONAL / 天气与体力备选</div><div class="timeline">'+d.locations.map((l,i)=>l.time==='—'?stopCard(l,id,i):'').join('')+'</div>':'')+(id===3?'<div class="note">省预算替代：上午甘榜格南与哈芝巷 → 午餐就近 → 下午小印度与Tekka Centre，今天不再进圣淘沙。两个片区之间用地铁或短程打车。</div>':'')+footer();}
 function flightView(){return '<div class="day-head"><div class="eyebrow">FLIGHT OPTIONS</div><h2>先比较，再出票。</h2><p>9月30日去程 / 10月3日回程 · 2成人 · 全部为当地时间，无时差。</p></div><div class="lead"><h2>带托运行李，优先看吉祥。</h2><p>'+esc(priceRecommendation())+'</p></div><div class="note" style="margin-bottom:18px">'+esc(QUOTE.scope)+'</div><div class="prep"><h3>机建、燃油与含税口径</h3><p>'+esc(QUOTE.taxScope)+'</p><div class="links">'+external(QUOTE.taxCtripSource,'携程预订须知')+external(QUOTE.taxChangiSource,'樟宜机场费用表')+'</div></div>'+FLIGHTS.map(f=>'<article class="flight'+(f.recommended?' recommended':'')+'"><div class="flight-top"><h3>'+esc(f.name)+'</h3><span class="badge">'+esc(f.tag)+'</span></div><div class="flight-row"><div><small>9/30 去程</small>'+f.out+'</div><b>'+f.ot+'</b></div><div class="flight-row"><div><small>10/3 回程</small>'+f.back+'</div><b>'+f.bt+'</b></div><div class="price-line"><span>含税往返产品</span><b>'+esc(f.price)+'</b></div><p class="price-note">'+esc(flightPriceNote(f))+'</p>'+productPrices(f)+'<p class="flight-note">'+esc(f.term)+'<br>'+esc(f.conditions)+'<br>'+esc(f.note)+'</p><div class="links">'+external(QUOTE.source,'携程2成人往返查询')+'</div></article>').join('')+'<div class="prep"><h3>报价与订单状态</h3><p>'+esc(QUOTE.status)+'</p><p class="price-note">本次价格核查：'+esc(QUOTE.date)+'，每组具体时刻见卡片。免费托运以各产品标示额度为准，超额行李另计。</p></div>'+footer();}
const CHECKS=['确定去回航班，核对2成人含税总额、燃油机建等费用明细及托运行李额度','预订9/30入住、10/3退房的3晚住宿','按最终航班确认樟宜航站楼与机场交通','若选环球影城，查看10/2营业日历并订票','准备适用交通支付方式及少量新币现金','准备防晒、雨伞、常用药与适配插头'];
function prepare(){return '<div class="day-head"><div class="eyebrow">BEFORE YOU GO</div><h2>出发前，留意这几件事。</h2><p>勾选状态保存在当前浏览器，方便下次继续。</p></div><div class="prep"><h3>准备清单</h3><ul class="checks">'+CHECKS.map((x,i)=>'<li><label><input type="checkbox" data-check="'+i+'" '+(checked(i)?'checked':'')+'><span>'+esc(x)+'</span></label></li>').join('')+'</ul></div><div class="prep"><h3>地铁与支付</h3><p>可查看SimplyGo支持的非接触式Visa / Mastercard。海外发行卡可能有每日SGD 0.60行政费；每位旅客各用一张卡或独立支付设备，进出站保持同一方式。熟食中心的支付方式因摊位而异，准备少量现金。</p><div class="links">'+external('https://www.simplygo.com.sg/faqs/cards-and-charms/simplygo/contactless-bank-cards','SimplyGo官方说明')+'</div></div><div class="prep"><h3>机场与行李</h3><p>春秋与吉祥参考航程使用樟宜T4。T4与Jewel分开，需接驳；D4的40分钟转场是包含走路与等车的规划缓冲，不是班车行驶时间。</p><div class="links">'+external('https://www.changiairport.com/cn/en/at-changi/transport-and-directions/transferring-between-terminals-jewel.html','机场接驳指南')+'</div></div><div class="prep"><h3>下雨就减项目</h3><p>D1取消夜景；D2用国家美术馆替代河边散步；D3海滩直接跳过。近邻用餐和休息优先，不为拍照或名店绕路。</p></div><div class="prep"><h3>餐饮说明</h3><p>餐饮卡已补充小红书代表笔记里的排队、口味与价格信号；大众点评已切到新加坡城市页，但当前搜索接口返回错误，因此没有写入评分或评论。所有营业时间、价格和摊位以当天现场为准。</p></div><div class="section-label">SOURCES / 核对信息</div><ol class="source-list"><li>'+external('https://www.gardensbythebay.com.sg/en/things-to-do/calendar-of-events/garden-rhapsody.html','花园灯光秀 · 常规19:45 / 20:45','')+'</li><li>'+external('https://www.rwsentosa.com/en/play/universal-studios-singapore','环球影城 · 官方开放日历与票务','')+'</li><li>'+external('https://www.visitsingapore.com/things-to-do/dining/local-food-and-drinks/experience-local-delights/','新加坡旅游局 · 熟食中心介绍','')+'</li><li>'+external('https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent('新加坡 老巴刹 沙爹街'),'小红书 · 老巴刹代表搜索','')+'</li><li>'+external('https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent('新加坡 牛车水 熟食中心 海南鸡饭 叻沙'),'小红书 · 牛车水代表搜索','')+'</li><li>'+external('https://m.dianping.com/dphome','大众点评 · 新加坡城市页（当前搜索接口异常）','')+'</li><li>'+external('https://www.onemap.gov.sg/','OneMap · 新加坡土地管理局地图','')+'</li></ol>'+footer();}
function checked(i){try{return localStorage.getItem('sg2026-check-'+i)==='1'}catch{return false}}
function footer(){return '<footer class="foot">行程资料：2026.09.27 · 票价核查：'+esc(QUOTE.date)+'（具体时间见航班卡）<br>参考行程，航班和酒店尚未预订；含税报价未锁定，最终费用以购买页为准。</footer>';}
function go(i){cur=i;Array.from(tabs.children).forEach((t,n)=>{t.setAttribute('aria-selected',String(n===i));t.tabIndex=n===i?0:-1});content.setAttribute('aria-labelledby','tab-'+i);content.innerHTML=i===0?overview():i===5?flightView():i===6?prepare():dayView(i);document.getElementById('map-heading').textContent=i>0&&i<5?'D'+i+' · 当天地点':'新加坡 · 全程地点';showMap(i);}
content.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){go(+b.dataset.go);document.getElementById('tabs').scrollIntoView({block:'start',behavior:'smooth'})}const p=e.target.closest('[data-loc]');if(p){const marker=pointMarkers[p.dataset.loc];if(map&&marker){document.querySelector('.map-panel').scrollIntoView({block:'nearest',behavior:'smooth'});map.setView(marker.getLatLng(),16);marker.openPopup()}else mapFailed()}});
content.addEventListener('change',e=>{if(e.target.matches('[data-check]')){try{localStorage.setItem('sg2026-check-'+e.target.dataset.check,e.target.checked?'1':'0')}catch{}}});
function mapFailed(){document.getElementById('map-notice').classList.add('show')}
function initMap(){if(map||!window.L)return;map=L.map('map',{center:[1.302,103.87],zoom:12,minZoom:11,maxZoom:18,scrollWheelZoom:false,maxBounds:[[1.16,103.58],[1.5,104.15]],maxBoundsViscosity:.9});L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png',{minZoom:11,maxZoom:18,attribution:'<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:20px;width:20px" alt=""> <a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener noreferrer">OneMap</a> &copy; contributors | <a href="https://www.sla.gov.sg/" target="_blank" rel="noopener noreferrer">Singapore Land Authority</a>'}).on('tileerror',mapFailed).on('tileload',()=>document.getElementById('map-notice').classList.remove('show')).addTo(map);group=L.layerGroup().addTo(map);L.circle([1.3008,103.8559],{radius:350,color:'#789a7e',weight:1,dashArray:'4,5',fillOpacity:.10}).addTo(map).bindPopup('Bugis 建议住宿片区<br>酒店未定，并非已订酒店位置');showMap(cur);}
function showMap(i){if(!map||!group)return;group.clearLayers();pointMarkers={};const selected=i>0&&i<5?[DAYS[i-1]]:DAYS;const coords=[];selected.forEach(d=>{let order=0,route=[];d.locations.forEach((l,j)=>{if(!local(l))return;const alt=l.time==='—';if(i===0&&alt)return;const n=alt?'·':++order;const c=COLORS[d.id-1];const marker=L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html:'<span class="marker '+(alt?'alt':'')+'" style="--c:'+c+'">'+n+'</span>',iconSize:[28,28],iconAnchor:[14,14]}),title:l.name}).addTo(group).bindPopup('<b>'+esc(l.name)+'</b><br>'+esc(alt?'备选':l.time)+'<br>'+external(navUrl(l),'导航',''));pointMarkers[d.id+':'+j]=marker;coords.push([l.lat,l.lng]);if(!alt)route.push([l.lat,l.lng])});if(i>0&&i<5&&route.length>1)L.polyline(route,{color:COLORS[d.id-1],weight:2,dashArray:'5,8',opacity:.65}).addTo(group)});if(coords.length)map.fitBounds(coords,{padding:[38,38],maxZoom:i>0&&i<5?15:12});}
document.getElementById('print-content').innerHTML='<section><h2>新加坡 · 4天3晚</h2><p>2026.09.30–10.03 · 两人 · 参考计划，机酒未订</p><p>预算目标：双人往返机票≤'+money(QUOTE.budget)+'；报价核查：'+esc(QUOTE.date)+'。</p><p>'+esc(priceRecommendation())+'</p><p>'+esc(QUOTE.scope)+'</p><p><b>机建、燃油与含税口径：</b>'+esc(QUOTE.taxScope)+'</p><p>'+esc(QUOTE.status)+'</p>'+FLIGHTS.map(f=>'<article><b>'+esc(f.name)+' · '+esc(f.price)+'</b><p>9/30 去程 '+f.out+' '+f.ot+'；10/3 返程 '+f.back+' '+f.bt+'；'+esc(f.term)+'</p><p>'+esc(flightPriceNote(f))+'</p>'+productPrices(f)+'<p>'+esc(f.conditions)+' '+esc(f.note)+'</p></article>').join('')+'<p>'+external(QUOTE.source,'携程2成人往返报价来源','')+'</p></section>'+DAYS.map(d=>'<section><h2>'+d.date+' · '+esc(d.title)+'</h2>'+d.locations.map(l=>'<article><b>'+esc(l.time==='—'?'备选':l.time)+' · '+esc(l.name)+'</b><p>'+esc(l.desc)+'</p>'+(l.detail?'<p>'+esc(l.detail)+'</p>':'')+'</article>').join('')+'</section>').join('');
go(0);setTimeout(()=>{if(!map)mapFailed()},10000);
